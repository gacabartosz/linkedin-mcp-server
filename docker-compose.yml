# LinkedIn MCP — production stack (HEADLESS — daemons only)
# Deployed to: VPS 51.68.174.118 at /opt/linkedin-mcp/
#
# Web UI: bartoszgaca.pl/admin/ (handled by bartoszgaca.pl backend, reads
# /data/linkedin-mcp/content.db read-only). NO public dashboard exposure
# from this stack — dashboard.mjs runs internally for OAuth callback only.
#
# Volumes:
#   /data/linkedin-mcp/  (persisted DBs + auth.json + scraper-auth.json)
#   /etc/linkedin-mcp/.env  (read-only env_file)
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f auto-publish

x-common: &common
  image: linkedin-mcp:latest
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - /etc/linkedin-mcp/.env
  volumes:
    - /data/linkedin-mcp:/data/linkedin-mcp
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # Internal-only OAuth callback server. Reachable from host on 127.0.0.1:3336.
  # Used when user triggers OAuth refresh from bartoszgaca.pl/admin/biuletyn (proxy via backend).
  dashboard:
    <<: *common
    container_name: linkedin-mcp-dashboard
    command: ["node", "dashboard.mjs"]
    environment:
      PORT: "3336"
      LINKEDIN_DATA_DIR: /data/linkedin-mcp
    ports:
      - "127.0.0.1:3336:3336"
    networks:
      - default

  auto-publish:
    <<: *common
    container_name: linkedin-mcp-auto-publish
    command: ["node", "auto-publish.mjs"]
    networks:
      - default

  auto-engage:
    <<: *common
    container_name: linkedin-mcp-auto-engage
    command: ["node", "auto-engage.mjs"]
    networks:
      - default

  auto-analytics:
    <<: *common
    container_name: linkedin-mcp-auto-analytics
    command: ["node", "auto-analytics.mjs", "--daemon"]
    networks:
      - default

  newsletter-send:
    <<: *common
    container_name: linkedin-mcp-newsletter-send
    # Newsletter sender runs on a daily cron pattern (08:00). Wrapper sleeps 1h between runs.
    command: ["sh", "-c", "while true; do node scripts/send-edition.mjs || true; sleep 3600; done"]
    networks:
      - default

networks:
  default:
    driver: bridge
